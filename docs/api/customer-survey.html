<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐后评价问卷 API 接口文档</title>
  <style>
    :root { --primary: #2563eb; --border: #dbe3ef; --muted: #64748b; --bg: #f5f7fb; --code: #111827; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1e293b; background: var(--bg); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 300px; padding: 24px 18px; overflow-y: auto; background: #fff; border-right: 1px solid var(--border); }
    .brand { margin: 0 0 18px; font-size: 20px; }
    .search { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
    .group-title { display: flex; justify-content: space-between; width: 100%; margin-top: 18px; padding: 8px 4px; border: 0; background: none; font-weight: 700; text-align: left; cursor: pointer; }
    .menu { display: grid; gap: 6px; }
    .menu button { padding: 9px 10px; border: 0; border-radius: 7px; color: #475569; background: transparent; text-align: left; cursor: pointer; }
    .menu button:hover, .menu button.active { color: var(--primary); background: #eff6ff; }
    .main { margin-left: 300px; padding: 36px; }
    .panel { max-width: 1080px; margin: 0 auto; padding: 30px; border: 1px solid var(--border); border-radius: 14px; background: #fff; box-shadow: 0 8px 24px rgba(15, 23, 42, .05); }
    .home-button { margin-bottom: 20px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; }
    h1 { margin-top: 0; font-size: 28px; }
    h2 { margin-top: 30px; font-size: 18px; }
    .endpoint { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 8px; background: #f8fafc; }
    .method { padding: 3px 9px; border-radius: 999px; color: #fff; background: #16a34a; font-size: 12px; font-weight: 700; }
    code, pre { font-family: "SFMono-Regular", Consolas, monospace; }
    pre { margin: 0; padding: 16px; overflow: auto; border-radius: 8px; color: #e5e7eb; background: var(--code); white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: #f8fafc; }
    .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .tabs button { padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; }
    .tabs button.active { color: #fff; border-color: var(--primary); background: var(--primary); }
    .muted { color: var(--muted); }
    .hidden { display: none; }
    @media (max-width: 800px) { .sidebar { position: static; width: auto; } .main { margin-left: 0; padding: 16px; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1 class="brand">餐后评价问卷 API</h1>
    <input id="search" class="search" placeholder="搜索编号、名称或路径">
    <div id="navigation"></div>
  </aside>
  <main class="main">
    <button id="homeButton" class="home-button hidden">返回首页</button>
    <section id="welcome" class="panel">
      <h1>餐后评价问卷 API 接口文档</h1>
      <p class="muted">当前共 6 个业务接口，均属于 B 端基础配置。点击左侧目录查看单个接口契约。</p>
    </section>
    <section id="content" class="panel hidden"></section>
  </main>
  <script>
    const apis = [
      {
        code: 'B01', group: 'B 端—基础配置', name: '查询样式配置', method: 'POST', path: '/admin/style/detail',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。']
        ],
        exampleJson: { merchant_id: 1 },
        exampleCurl: `curl -X POST 'http://localhost/admin/style/detail' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            theme_color: '#FE8F22',
            button_text_color: '#FFFFFF',
            banner_url: 'http://static.xibeidev.com/xibei_gongfucai/banner/20260630/78f7cb0419ac572c.png'
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '样式配置对象。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.theme_color', 'string', '主题色，#RRGGBB 格式；未配置时为空字符串。'],
          ['data.button_text_color', 'string', '按钮文字颜色，#RRGGBB 格式；未配置时为空字符串。'],
          ['data.banner_url', 'string', 'Banner 实际 URL；未配置时为空字符串。']
        ]
      },
      {
        code: 'B02', group: 'B 端—基础配置', name: '保存样式配置', method: 'POST', path: '/admin/style/save',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。'],
          ['theme_color', 'string', '必填', '主题色，必须符合 #RRGGBB 格式。'],
          ['button_text_color', 'string', '必填', '按钮文字颜色，必须符合 #RRGGBB 格式。'],
          ['banner_url', 'string', '必填', '已上传 Banner 的完整 HTTP/HTTPS URL。']
        ],
        exampleJson: {
          merchant_id: 1,
          theme_color: '#FE8F22',
          button_text_color: '#FFFFFF',
          banner_url: 'http://static.xibeidev.com/xibei_gongfucai/banner/20260630/78f7cb0419ac572c.png'
        },
        exampleCurl: `curl -X POST 'http://localhost/admin/style/save' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1,"theme_color":"#FE8F22","button_text_color":"#FFFFFF","banner_url":"http://static.xibeidev.com/xibei_gongfucai/banner/20260630/78f7cb0419ac572c.png"}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            theme_color: '#FE8F22',
            button_text_color: '#FFFFFF',
            banner_url: 'http://static.xibeidev.com/xibei_gongfucai/banner/20260630/78f7cb0419ac572c.png'
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '保存后的样式配置对象。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.theme_color', 'string', '已保存的主题色。'],
          ['data.button_text_color', 'string', '已保存的按钮文字颜色。'],
          ['data.banner_url', 'string', '已保存的 Banner 实际 URL。']
        ]
      },
      {
        code: 'B03', group: 'B 端—基础配置', name: '查询问卷配置', method: 'POST', path: '/admin/questionnaire/detail',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。']
        ],
        exampleJson: { merchant_id: 1 },
        exampleCurl: `curl -X POST 'http://localhost/admin/questionnaire/detail' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            trigger_mode: 1,
            delay_minutes: null,
            reward_points: 1,
            points: 19,
            reward_coupon: 1,
            coupon_template_id: '100426507'
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '问卷配置对象。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.trigger_mode', 'integer', '触发时机：1=立即推送 / 2=延迟推送；未配置时默认 1。'],
          ['data.delay_minutes', 'integer|null', '延迟推送分钟数；仅 trigger_mode=2 时有值，否则为 null。'],
          ['data.reward_points', 'integer', '积分开关：1=启用 / 0=关闭；未配置时默认 0。'],
          ['data.points', 'integer', '积分数量；reward_points=0 时为 0。'],
          ['data.reward_coupon', 'integer', '券开关：1=启用 / 0=关闭；可与积分同时启用；未配置时默认 0。'],
          ['data.coupon_template_id', 'string', '微生活 CRM 券模板 ID；reward_coupon=0 时为空字符串。']
        ]
      },
      {
        code: 'B04', group: 'B 端—基础配置', name: '保存问卷配置', method: 'POST', path: '/admin/questionnaire/save',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。'],
          ['trigger_mode', 'integer', '必填', '触发时机：1=立即推送 / 2=延迟推送。'],
          ['delay_minutes', 'integer', '条件必填', '延迟推送分钟数；trigger_mode=2 时必填且范围 1-1440（最长 24 小时）；trigger_mode=1 时传任何值都会被置空。'],
          ['reward_points', 'integer', '必填', '积分开关：1=启用 / 0=关闭。'],
          ['points', 'integer', '条件必填', '积分数量；reward_points=1 时必填且为正整数；reward_points=0 时传任何值都会被归零。'],
          ['reward_coupon', 'integer', '必填', '券开关：1=启用 / 0=关闭；可与积分同时启用或同时关闭。'],
          ['coupon_template_id', 'string', '条件必填', '微生活 CRM 券模板 ID；reward_coupon=1 时必填；reward_coupon=0 时传任何值都会被置空。券模板列表由 CRM 侧提供，本接口不查询。']
        ],
        exampleJson: {
          merchant_id: 1,
          trigger_mode: 2,
          delay_minutes: 30,
          reward_points: 1,
          points: 50,
          reward_coupon: 1,
          coupon_template_id: '100426507'
        },
        exampleCurl: `curl -X POST 'http://localhost/admin/questionnaire/save' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1,"trigger_mode":2,"delay_minutes":30,"reward_points":1,"points":50,"reward_coupon":1,"coupon_template_id":"100426507"}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            trigger_mode: 2,
            delay_minutes: 30,
            reward_points: 1,
            points: 50,
            reward_coupon: 1,
            coupon_template_id: '100426507'
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '保存后的问卷配置对象，字段口径同 B03。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.trigger_mode', 'integer', '已保存的触发时机。'],
          ['data.delay_minutes', 'integer|null', '已保存的延迟分钟数；立即推送时为 null。'],
          ['data.reward_points', 'integer', '已保存的积分开关。'],
          ['data.points', 'integer', '已保存的积分数量；积分关闭时为 0。'],
          ['data.reward_coupon', 'integer', '已保存的券开关。'],
          ['data.coupon_template_id', 'string', '已保存的券模板 ID；券关闭时为空字符串。']
        ]
      },
      {
        code: 'B05', group: 'B 端—基础配置', name: '查询菜品配置', method: 'POST', path: '/admin/dish/detail',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。']
        ],
        exampleJson: { merchant_id: 1 },
        exampleCurl: `curl -X POST 'http://localhost/admin/dish/detail' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            dish_link_enabled: 1
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '菜品配置对象。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.dish_link_enabled', 'integer', '菜品数据关联开关：1=启用（问卷可关联 CRM 菜品）/ 0=禁用；未配置时默认 0。']
        ]
      },
      {
        code: 'B06', group: 'B 端—基础配置', name: '保存菜品配置', method: 'POST', path: '/admin/dish/save',
        params: [
          ['merchant_id', 'integer', '必填', '商户 ID，必须是正整数。'],
          ['dish_link_enabled', 'integer', '必填', '菜品数据关联开关：1=启用 / 0=禁用。']
        ],
        exampleJson: {
          merchant_id: 1,
          dish_link_enabled: 1
        },
        exampleCurl: `curl -X POST 'http://localhost/admin/dish/save' \\
  -H 'Content-Type: application/json' \\
  -d '{"merchant_id":1,"dish_link_enabled":1}'`,
        responseJson: {
          code: 0, message: '成功', data: {
            merchant_id: 1,
            dish_link_enabled: 1
          }
        },
        responseFields: [
          ['code', 'integer', '业务响应码，0 表示成功。'],
          ['message', 'string', '响应提示。'],
          ['data', 'object', '保存后的菜品配置对象。'],
          ['data.merchant_id', 'integer', '商户 ID。'],
          ['data.dish_link_enabled', 'integer', '已保存的菜品数据关联开关。']
        ]
      }
    ];

    const navigation = document.getElementById('navigation');
    const content = document.getElementById('content');
    const welcome = document.getElementById('welcome');
    const homeButton = document.getElementById('homeButton');

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
    }

    function renderTable(headers, rows) {
      return `<table><thead><tr>${headers.map(item => `<th>${item}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    function renderNavigation(keyword = '') {
      const filtered = apis.filter(api => `${api.code} ${api.name} ${api.path}`.toLowerCase().includes(keyword.toLowerCase()));
      const groups = Object.groupBy ? Object.groupBy(filtered, api => api.group) : filtered.reduce((result, api) => ((result[api.group] ||= []).push(api), result), {});
      navigation.innerHTML = Object.entries(groups).map(([group, items]) => `
        <button class="group-title" type="button" onclick="this.nextElementSibling.classList.toggle('hidden')"><span>${group}</span><span>▾</span></button>
        <div class="menu">${items.map(api => `<button type="button" data-code="${api.code}">${api.code} ${api.name}</button>`).join('')}</div>
      `).join('') || '<p class="muted">无匹配接口</p>';
      navigation.querySelectorAll('[data-code]').forEach(button => button.addEventListener('click', () => showApi(button.dataset.code)));
    }

    function showApi(code) {
      const api = apis.find(item => item.code === code);
      if (!api) return;
      welcome.classList.add('hidden');
      content.classList.remove('hidden');
      homeButton.classList.remove('hidden');
      content.innerHTML = `
        <h1>${api.code} ${api.name}</h1>
        <h2>1. 请求地址</h2>
        <div class="endpoint"><span class="method">${api.method}</span><code>${api.path}</code></div>
        <h2>2. 请求参数表</h2>
        ${renderTable(['字段名', '类型', '必填·可选', '说明'], api.params)}
        <h2>3. 请求示例</h2>
        <div class="tabs"><button class="active" data-tab="json">JSON Body</button><button data-tab="curl">curl</button></div>
        <pre data-pane="json">${escapeHtml(JSON.stringify(api.exampleJson, null, 2))}</pre>
        <pre class="hidden" data-pane="curl">${escapeHtml(api.exampleCurl)}</pre>
        <h2>4. 响应结构 + 字段解释</h2>
        <pre>${escapeHtml(JSON.stringify(api.responseJson, null, 2))}</pre>
        <div style="height:12px"></div>
        ${renderTable(['字段路径', '类型', '说明'], api.responseFields)}
      `;
      content.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
        content.querySelectorAll('[data-tab]').forEach(item => item.classList.toggle('active', item === button));
        content.querySelectorAll('[data-pane]').forEach(pane => pane.classList.toggle('hidden', pane.dataset.pane !== button.dataset.tab));
      }));
      navigation.querySelectorAll('[data-code]').forEach(button => button.classList.toggle('active', button.dataset.code === code));
    }

    document.getElementById('search').addEventListener('input', event => renderNavigation(event.target.value));
    homeButton.addEventListener('click', () => {
      content.classList.add('hidden');
      welcome.classList.remove('hidden');
      homeButton.classList.add('hidden');
      navigation.querySelectorAll('[data-code]').forEach(button => button.classList.remove('active'));
    });
    renderNavigation();
  </script>
</body>
</html>
